<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sky Jumper - Mobile Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="screen">
            <h1>🚀 Sky Jumper</h1>
            <p>Tap to jump between platforms</p>
            <p>Collect stars for bonus points</p>
            <button id="start-btn">TAP TO START</button>
            <div class="high-score">High Score: <span id="high-score-display">0</span></div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p>Best: <span id="best-score">0</span></p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>

        <div id="hud">
            <div id="score">Score: 0</div>
            <div id="lives">❤️❤️❤️</div>
        </div>

        <div id="pause-btn">⏸️</div>

        <div id="pause-screen" class="screen hidden">
            <h1>Paused</h1>
            <button id="resume-btn">RESUME</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
